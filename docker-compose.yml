services:

  postgres:

    image: postgres:16-alpine

    container_name: qr-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: qr

      POSTGRES_PASSWORD: qr_dev_password

      POSTGRES_DB: qr_personel

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U qr -d qr_personel"]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 10s



  redis:

    image: redis:7-alpine

    container_name: qr-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:

      - "6379:6379"

    volumes:

      - redis_data:/data

    healthcheck:

      test: ["CMD", "redis-cli", "ping"]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 5s



  evolution-postgres:

    image: postgres:16-alpine

    container_name: qr-evolution-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: evolution

      POSTGRES_PASSWORD: evolution_dev_password

      POSTGRES_DB: evolution_api

    ports:

      - "5433:5432"

    volumes:

      - evolution_postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_api"]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 10s



  evolution-api:

    image: evoapicloud/evolution-api:latest

    container_name: qr-evolution-api

    restart: unless-stopped

    depends_on:

      evolution-postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

    ports:

      - "8080:8080"

    volumes:

      - evolution_instances:/evolution/instances

    env_file:

      - docker/evolution.env

    healthcheck:

      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]

      interval: 10s

      timeout: 5s

      retries: 12

      start_period: 30s



  evolution-manager:

    image: evoapicloud/evolution-manager:latest

    container_name: qr-evolution-manager

    restart: unless-stopped

    depends_on:

      evolution-api:

        condition: service_healthy

    ports:

      - "8082:80"



volumes:

  postgres_data:

  redis_data:

  evolution_postgres_data:

  evolution_instances:


