# Production stack — Coolify veya sunucuda:
#   cp docker/.env.production.example .env.production
#   # Şifreleri düzenleyin, sonra:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Coolify: New Resource → Docker Compose → bu dosyayı seçin.
# Domain'i "web" servisine bağlayın (port 80).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-qr_personel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qr} -d ${POSTGRES_DB:-qr_personel}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qr_personel}?schema=public
      REDIS_DISABLED: ${REDIS_DISABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET gerekli}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-qr-personel}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://api.iyzipay.com}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL:-}
    volumes:
      - uploads_data:/app/apps/api/uploads
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [whatsapp]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution_change_me}
      POSTGRES_DB: evolution_api
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution_api']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    profiles: [whatsapp]
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      SERVER_NAME: qr-evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution-api:8080}
      CORS_ORIGIN: '*'
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/evolution_api?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: qr_personel
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: qr_evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      CONFIG_SESSION_PHONE_CLIENT: QR Personel
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: 'false'
      LANGUAGE: en
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    restart: unless-stopped
    profiles: [whatsapp]
    depends_on:
      evolution-api:
        condition: service_healthy
    expose:
      - '80'

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  evolution_postgres_data:
  evolution_instances:
